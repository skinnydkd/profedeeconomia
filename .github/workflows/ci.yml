# Runs what a contributor runs before pushing: the test suite, the type check,
# a real production build, and the assertion that no slide overflows its 16:9
# box. Nothing here needs a secret — the build reads no credentials, and the
# deck renderer uses the Chrome that ships with the runner image.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      decks:
        description: Which subjects to re-check for slide overflow
        type: choice
        default: all
        options: [all, none]

permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The deck renderer uses the runner's own Chrome, so puppeteer's bundled
  # download (~150 MB) is dead weight on every install.
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  test:
    name: Tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx astro check

  build:
    name: Build and deck overflow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The deck step diffs against the base branch to decide which subjects
          # to render, so it needs history, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      # Rendering one subject's decks through headless Chrome costs a couple of
      # minutes, so only the subjects a change can actually have moved are
      # re-checked. scripts/ci-changed-decks.mjs decides, and has its own tests.
      - name: Decide which decks to re-check
        id: decks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DISPATCH_DECKS: ${{ inputs.decks }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch)
              if [ "$DISPATCH_DECKS" = "none" ]; then
                : > decks.txt
              else
                node scripts/ci-changed-decks.mjs --all > decks.txt
              fi
              ;;
            pull_request)
              git fetch --no-tags origin "$BASE_REF"
              git diff --name-only "origin/$BASE_REF...HEAD" \
                | node scripts/ci-changed-decks.mjs > decks.txt
              ;;
            *)
              # A brand-new branch reports an all-zero "before"; fall back to the
              # single commit rather than silently checking nothing.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                base="$SHA^"
              else
                base="$BEFORE"
              fi
              git diff --name-only "$base" "$SHA" \
                | node scripts/ci-changed-decks.mjs > decks.txt
              ;;
          esac
          count=$(grep -c . decks.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No deck can have moved — skipping the overflow check."
          else
            echo "Will check $count subject(s): $(tr '\n' ' ' < decks.txt)"
          fi

      - name: Locate Chrome
        if: steps.decks.outputs.count != '0'
        run: |
          set -euo pipefail
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then
              echo "PUPPETEER_EXECUTABLE_PATH=$c" >> "$GITHUB_ENV"
              echo "Using $c"
              exit 0
            fi
          done
          echo "::error::No Chrome on the runner; the deck overflow check cannot run."
          exit 1

      # Every subject runs even after one fails, so a red build names all of
      # them at once. The failure is collected explicitly rather than left to
      # `set -e`, which does not reliably abort out of a `while read` loop —
      # and a silently green overflow check is worse than no check at all.
      - name: Assert no slide overflows its 16:9 box
        if: steps.decks.outputs.count != '0'
        run: |
          set -uo pipefail
          failed=''
          while read -r subject; do
            [ -n "$subject" ] || continue
            echo "::group::$subject"
            if node scripts/build-deck-pdf.mjs "$subject"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$subject has at least one slide overflowing its 16:9 box."
              failed="$failed $subject"
            fi
          done < decks.txt
          if [ -n "$failed" ]; then
            echo "Decks not shippable:$failed"
            exit 1
          fi
          echo 'Every checked deck fits its box.'
